name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  AI_FIRST_VCS_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: scripts/check.sh
